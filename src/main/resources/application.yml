spring:
  application:
    name: e-commerce

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:test_token}
    username: ${TELEGRAM_BOT_USERNAME:}
    api-url: https://api.telegram.org/bot
    webhook-secret-token: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:dev-webhook-secret}

app:
  base-url: ${APP_BASE_URL:}
