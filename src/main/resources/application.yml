spring:
  application:
    name: e-commerce

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:test_token}
    username: ${TELEGRAM_BOT_USERNAME:}
    api-url: https://api.telegram.org/bot
    webhook-secret-token: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:dev-webhook-secret}

app:
  # Prioridad: APP_BASE_URL > APP_URL > RENDER_EXTERNAL_URL (Render lo inyecta en producción)
  base-url: ${APP_BASE_URL:${APP_URL:${RENDER_EXTERNAL_URL:}}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    url: https://generativelanguage.googleapis.com/v1beta/models
